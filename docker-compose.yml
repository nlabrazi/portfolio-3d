services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      secrets:
        - npmrc
    container_name: portfolio-3d
    restart: unless-stopped
    user: "${UID}:${GID}"
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["npx", "nuxt", "dev", "--host", "0.0.0.0", "--port", "3000"]

secrets:
  npmrc:
    file: ${NPMRC_FILE:-~/.npmrc}

volumes:
  node_modules:
