services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: portfolio-3d-app
    restart: unless-stopped
    user: "${UID}:${GID}"
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["npx", "nuxt", "dev", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  node_modules:
